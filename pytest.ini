[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    unit: Unit tests (fast, isolated component tests)
    integration: Integration tests (multiple components working together)
    e2e: End-to-end tests (full training runs)
    slow: Slow tests (>5s execution time)
addopts =
    --strict-markers
    --tb=short
    --disable-warnings
    -v
